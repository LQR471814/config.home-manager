rules:
  - capability: shell
    match:
      - "git status *"
      - "git fetch *"
      - "grep *"
      - "head *"
      - "tail *"
      - "ls *"
      - "stat *"
      - "lake *"
      - "lean *"
      - "elan *"
      - "echo *"
      - "sed *"
      - "cat *"
      - "timeout *"
    effect: allow
